<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="themeGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00D4FF" />   <stop offset="50%" stop-color="#D900FF" />  <stop offset="100%" stop-color="#FFC837" /> </linearGradient>

    <filter id="neon-glow-theme" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="12" fill="#0C1017" />

  <g filter="url(#neon-glow-theme)">
    
    <g fill="url(#themeGrad)">
      <rect x="38" y="38" width="6" height="6" />
      <rect x="50" y="38" width="6" height="6" />
      <rect x="44" y="44" width="6" height="6" />
      <rect x="56" y="44" width="6" height="6" />
      <rect x="38" y="50" width="6" height="6" />
      <rect x="50" y="50" width="6" height="6" />
      <rect x="44" y="56" width="6" height="6" />
      <rect x="56" y="56" width="6" height="6" />
    </g>
    <rect x="36" y="36" width="28" height="28" rx="3" fill="none" stroke="url(#themeGrad)" stroke-width="1.5" />

    <g fill="none" stroke="url(#themeGrad)" stroke-width="1.5" opacity="0.85">
      <rect x="28" y="28" width="44" height="44" rx="8" />
      <rect x="28" y="28" width="44" height="44" rx="8" transform="rotate(30 50 50)" />
      <rect x="28" y="28" width="44" height="44" rx="8" transform="rotate(60 50 50)" />
    </g>

    <g fill="none" stroke="url(#themeGrad)" stroke-linecap="round">
      <path d="M 28 28 A 32 32 0 0 0 28 72" stroke-width="2" />
      <path d="M 17 28 A 40 40 0 0 0 17 72" stroke-width="1.5" />
      <path d="M 13 20 A 48 48 0 0 0 13 80" stroke-width="1" />
      
      <path d="M 72 28 A 32 32 0 0 1 72 72" stroke-width="2" />
      <path d="M 83 28 A 40 40 0 0 1 83 72" stroke-width="1.5" />
      <path d="M 87 20 A 48 48 0 0 1 87 80" stroke-width="1" />
    </g>

    <g fill="url(#themeGrad)">
      <rect x="20" y="16" width="2" height="2" />
      <rect x="14" y="26" width="2" height="2" />
      <rect x="8" y="20" width="1.5" height="1.5" />
      <rect x="16" y="85" width="2" height="2" />
      <rect x="22" y="80" width="1.5" height="1.5" />
      
      <rect x="78" y="16" width="2" height="2" />
      <rect x="84" y="26" width="2" height="2" />
      <rect x="90" y="20" width="1.5" height="1.5" />
      <rect x="82" y="85" width="2" height="2" />
      <rect x="76" y="80" width="1.5" height="1.5" />
    </g>

  </g>
</svg>

